services:
  ai-proxy:
    image: metacubex/mihomo:v1.18.9
    container_name: ai-proxy
    command: ["-d", "/root/.config/mihomo"]
    volumes:
      - ./config.yaml:/root/.config/mihomo/config.yaml
      - ./providers:/root/.config/mihomo/providers
    ports:
      - "127.0.0.1:7890:7890"
      - "127.0.0.1:9090:9090"
    networks:
      - ai_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dashboard-core:
    image: ghcr.io/metacubex/metacubexd:latest
    container_name: ai-proxy-dashboard-core
    networks:
      - dashboard_internal
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build:
      context: ./dashboard
    container_name: ai-proxy-dashboard
    environment:
      DASHBOARD_UPSTREAM: http://dashboard-core:80
      MIHOMO_URL: http://ai-proxy:9090
      MIHOMO_CONFIG: /run/secrets/ai-proxy-config
      DELAY_TEST_URLS: https://www.gstatic.com/generate_204,https://cp.cloudflare.com/generate_204,https://www.google.com/generate_204
      DELAY_TEST_TIMEOUT_MS: "5000"
    volumes:
      - ./config.yaml:/run/secrets/ai-proxy-config:ro
    depends_on:
      - dashboard-core
      - ai-proxy
    ports:
      - "127.0.0.1:9091:3000"
    networks:
      - dashboard_internal
      - ai_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ai_network:
    external: true
    name: ai_network
  dashboard_internal:
    driver: bridge
